<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1330" width="100%" font-family="'Segoe UI','Microsoft YaHei',-apple-system,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      text{fill:#1f2937}
      .docT{font-size:22px;font-weight:700}
      .docS{font-size:13px;fill:#6b7280}
      .bandT{font-size:15px;font-weight:700}
      .modT{font-size:13px;font-weight:700}
      .modS{font-size:11px;fill:#4b5563}
      .pill{font-size:11px;font-weight:600}
      .lbl{font-size:11.5px;fill:#64748b}
      .mod{fill:#ffffff;stroke-width:1.3}
      .b-el{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}   .m-el{stroke:#6366f1}
      .b-rd{fill:#ecfeff;stroke:#06b6d4;stroke-width:1.5}   .m-rd{stroke:#06b6d4}
      .b-ho{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.5}   .m-ho{stroke:#22c55e}
      .b-en{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}   .m-en{stroke:#f97316}
      .b-ev{fill:#faf5ff;stroke:#a855f7;stroke-width:1.5}   .m-ev{stroke:#a855f7}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="1330" fill="#ffffff"/>
  <text class="docT" x="24" y="34">IPMaster-Cowork 系统架构</text>
  <text class="docS" x="24" y="54">纵向 = 分层依赖（上层只依赖下层稳定契约）；每层内部按职责再解耦；横向事件流与纵向依赖正交</text>

  <!-- ═══════════ 外壳层 Electron ═══════════ -->
  <rect class="b-el" x="20" y="70" width="1140" height="118" rx="14"/>
  <text class="bandT" x="36" y="94" fill="#4338ca">① 外壳层 · Electron 主进程 (Node)</text>
  <!-- 5 modules -->
  <g>
    <rect class="mod m-el" x="36"  y="106" width="212" height="66" rx="9"/>
    <text class="modT" x="142" y="132" text-anchor="middle">main.js</text>
    <text class="modS" x="142" y="150" text-anchor="middle">窗口·生命周期</text>
    <text class="modS" x="142" y="164" text-anchor="middle">后端 spawn·webview 隔离</text>

    <rect class="mod m-el" x="260" y="106" width="212" height="66" rx="9"/>
    <text class="modT" x="366" y="132" text-anchor="middle">preload.js</text>
    <text class="modS" x="366" y="150" text-anchor="middle">contextBridge</text>
    <text class="modS" x="366" y="164" text-anchor="middle">→ window.electronAPI</text>

    <rect class="mod m-el" x="484" y="106" width="212" height="66" rx="9"/>
    <text class="modT" x="590" y="132" text-anchor="middle">lib/auth.js</text>
    <text class="modS" x="590" y="150" text-anchor="middle">OAuth PKCE + 回调</text>
    <text class="modS" x="590" y="164" text-anchor="middle">devSkipAuth 门</text>

    <rect class="mod m-el" x="708" y="106" width="212" height="66" rx="9"/>
    <text class="modT" x="814" y="132" text-anchor="middle">updater.js</text>
    <text class="modS" x="814" y="150" text-anchor="middle">electron-updater</text>
    <text class="modS" x="814" y="164" text-anchor="middle">feed 检查·安装</text>

    <rect class="mod m-el" x="932" y="106" width="212" height="66" rx="9"/>
    <text class="modT" x="1038" y="132" text-anchor="middle">telemetry.js</text>
    <text class="modS" x="1038" y="150" text-anchor="middle">遥测 · 崩溃上报</text>
    <text class="modS" x="1038" y="164" text-anchor="middle">Token 用量转发</text>
  </g>

  <!-- arrows Electron -> Renderer -->
  <line x1="400" y1="190" x2="400" y2="224" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="lbl" x="410" y="211">加载 URL（dev:vite / prod:后端）</text>
  <line x1="820" y1="224" x2="820" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="lbl" x="700" y="211" text-anchor="end">IPC（contextBridge 双向）</text>

  <!-- ═══════════ 渲染层 frontend-desktop ═══════════ -->
  <rect class="b-rd" x="20" y="228" width="1140" height="182" rx="14"/>
  <text class="bandT" x="36" y="252" fill="#0e7490">② 渲染层 · frontend-desktop (React + Vite + TS)</text>
  <g>
    <rect class="mod m-rd" x="36"  y="264" width="361" height="56" rx="9"/>
    <text class="modT" x="216" y="288" text-anchor="middle">App 外壳</text>
    <text class="modS" x="216" y="306" text-anchor="middle">AuthGate · 三栏布局 · openUrl 分流(file/http)</text>

    <rect class="mod m-rd" x="409" y="264" width="373" height="56" rx="9"/>
    <text class="modT" x="595" y="288" text-anchor="middle">useSessionSSE</text>
    <text class="modS" x="595" y="306" text-anchor="middle">EventSource → handle 归约器 → SSEState(ChatItem[])</text>

    <rect class="mod m-rd" x="794" y="264" width="350" height="56" rx="9"/>
    <text class="modT" x="969" y="288" text-anchor="middle">api/ 客户端</text>
    <text class="modS" x="969" y="306" text-anchor="middle">sessions·hitl·llms·skills·workspace（REST 薄封装）</text>

    <rect class="mod m-rd" x="36"  y="332" width="548" height="60" rx="9"/>
    <text class="modT" x="310" y="356" text-anchor="middle">视图组件</text>
    <text class="modS" x="310" y="374" text-anchor="middle">ChatPanel · SessionList · WorkspacePanel · BrowserPanel · Skills/LLM 页</text>

    <rect class="mod m-rd" x="596" y="332" width="548" height="60" rx="9"/>
    <text class="modT" x="870" y="356" text-anchor="middle">preview 子系统</text>
    <text class="modS" x="870" y="374" text-anchor="middle">fileType 分发 → viewers/(md·docx·pdf·pptx·html·code) → worker/</text>
  </g>

  <!-- arrow Renderer -> Host -->
  <line x1="590" y1="410" x2="590" y2="444" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text class="lbl" x="600" y="431">HTTP /api/v1/*  +  SSE /sessions/{id}/stream （dev 经 vite 代理→:15926；prod 同源）</text>

  <!-- ═══════════ 宿主层 ipmastercowork ═══════════ -->
  <rect class="b-ho" x="20" y="448" width="1140" height="236" rx="14"/>
  <text class="bandT" x="36" y="472" fill="#15803d">③ 宿主层 · ipmastercowork (FastAPI / uvicorn, 127.0.0.1:15926)</text>
  <g>
    <rect class="mod m-ho" x="36" y="484" width="1108" height="46" rx="9"/>
    <text class="modT" x="590" y="504" text-anchor="middle">cli.py / build_runtime</text>
    <text class="modS" x="590" y="521" text-anchor="middle">装配缝：建 ProviderRegistry · 注入真实 Providers · 挂能力授权器</text>

    <rect class="mod m-ho" x="36"  y="542" width="548" height="56" rx="9"/>
    <text class="modT" x="310" y="566" text-anchor="middle">api/ 路由层</text>
    <text class="modS" x="310" y="584" text-anchor="middle">sessions·hitl·llms·mcp·workspace·skills·templates·spool + SSE</text>

    <rect class="mod m-ho" x="596" y="542" width="548" height="56" rx="9"/>
    <text class="modT" x="870" y="566" text-anchor="middle">api/models · SessionEntry（会话注册表）</text>
    <text class="modS" x="870" y="584" text-anchor="middle">translate_event：引擎 EventType → SSE 帧 · sse_generator</text>

    <rect class="mod m-ho" x="36"  y="608" width="490" height="58" rx="9"/>
    <text class="modT" x="281" y="632" text-anchor="middle">providers/ 注入实现</text>
    <text class="modS" x="281" y="650" text-anchor="middle">llm·templates·fs·mcp·skills·webview·memory（实现引擎协议）</text>

    <rect class="mod m-ho" x="538" y="608" width="270" height="58" rx="9"/>
    <text class="modT" x="673" y="632" text-anchor="middle">auth/ 授权器</text>
    <text class="modS" x="673" y="650" text-anchor="middle">bash/写文件 HITL 门控</text>

    <rect class="mod m-ho" x="820" y="608" width="324" height="58" rx="9"/>
    <text class="modT" x="982" y="632" text-anchor="middle">persistence/</text>
    <text class="modS" x="982" y="650" text-anchor="middle">event_store·投影·快照·崩溃恢复</text>
  </g>

  <!-- arrows Host <-> Engine (依赖倒置 + 事件回流) -->
  <line x1="470" y1="684" x2="470" y2="718" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
  <text class="lbl" x="480" y="705">注入 Providers（依赖倒置：协议在引擎，实现在宿主）</text>
  <line x1="930" y1="718" x2="930" y2="684" stroke="#a855f7" stroke-width="1.8" marker-end="url(#ah)"/>
  <text class="lbl" x="920" y="705" text-anchor="end" fill="#9333ea">订阅 EventBus ↑</text>

  <!-- ═══════════ 引擎层 ctx_weft ═══════════ -->
  <rect class="b-en" x="20" y="722" width="1140" height="352" rx="14"/>
  <text class="bandT" x="36" y="746" fill="#c2410c">④ 引擎层 · ctx_weft 推理内核（vendor/ctx_weft/ · 纯净无 I/O）</text>

  <rect class="mod m-en" x="36" y="758" width="1108" height="46" rx="9"/>
  <text class="modT" x="590" y="778" text-anchor="middle">core/runtime · CtxWeftRuntime 门面</text>
  <text class="modS" x="590" y="795" text-anchor="middle">ProviderRegistry：memory / knowledge / capability / llm 依赖注入</text>

  <!-- 3 columns: orchestrator | loop | assembler -->
  <rect class="mod m-en" x="36" y="816" width="320" height="150" rx="9"/>
  <text class="modT" x="196" y="838" text-anchor="middle">core/orchestrator</text>
  <text class="modS" x="196" y="862" text-anchor="middle">SessionManager</text>
  <text class="modS" x="196" y="882" text-anchor="middle">TaskManager（调度·并发·串行化）</text>
  <text class="modS" x="196" y="902" text-anchor="middle">HitlManager（人在环）</text>
  <text class="modS" x="196" y="922" text-anchor="middle">LifecycleManager（派生 agent）</text>

  <rect class="mod m-en" x="368" y="816" width="444" height="150" rx="9"/>
  <text class="modT" x="590" y="838" text-anchor="middle">core/loop · 一个回合的状态机</text>
  <!-- step pills -->
  <g class="pill">
    <rect x="384" y="850" width="94" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="431" y="867" text-anchor="middle">Prepare</text>
    <rect x="488" y="850" width="94" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="535" y="867" text-anchor="middle">Act</text>
    <rect x="592" y="850" width="94" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="639" y="867" text-anchor="middle">Observe</text>
    <rect x="696" y="850" width="100" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="746" y="867" text-anchor="middle">Finalize</text>
  </g>
  <line x1="478" y1="863" x2="486" y2="863" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="582" y1="863" x2="590" y2="863" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="686" y1="863" x2="694" y2="863" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/>
  <!-- gateway pills -->
  <rect x="384" y="896" width="412" height="28" rx="6" fill="#fff" stroke="#ea580c"/>
  <text class="modS" x="590" y="914" text-anchor="middle" font-weight="600">llm_gateway：发送前合法化 + 断流自愈</text>
  <rect x="384" y="930" width="412" height="28" rx="6" fill="#fff" stroke="#ea580c"/>
  <text class="modS" x="590" y="948" text-anchor="middle" font-weight="600">capability_gateway：授权·校验·spill·双写记忆</text>

  <rect class="mod m-en" x="824" y="816" width="320" height="150" rx="9"/>
  <text class="modT" x="984" y="838" text-anchor="middle">core/assembler</text>
  <text class="modS" x="984" y="864" text-anchor="middle">上下文装配流水线</text>
  <rect x="844" y="878" width="80" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text class="pill" x="884" y="895" text-anchor="middle">sources</text>
  <rect x="944" y="878" width="80" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text class="pill" x="984" y="895" text-anchor="middle">budget</text>
  <rect x="1044" y="878" width="82" height="26" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text class="pill" x="1085" y="895" text-anchor="middle">composer</text>
  <line x1="924" y1="891" x2="942" y2="891" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="1024" y1="891" x2="1042" y2="891" stroke="#c2410c" stroke-width="1.4" marker-end="url(#ah)"/>
  <text class="modS" x="984" y="930" text-anchor="middle">按优先级/预算装配 prompt</text>
  <text class="modS" x="984" y="948" text-anchor="middle">溢出 → ContextOverflowError</text>

  <!-- orchestrator -> loop -> assembler couplings -->
  <line x1="356" y1="885" x2="366" y2="885" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="822" y1="885" x2="814" y2="885" stroke="#c2410c" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- bottom row: events | state|control | protocols | providers -->
  <rect class="mod m-en" x="36"  y="982" width="268" height="76" rx="9"/>
  <text class="modT" x="170" y="1006" text-anchor="middle">core/events</text>
  <text class="modS" x="170" y="1024" text-anchor="middle">InProcessEventBus</text>
  <text class="modS" x="170" y="1042" text-anchor="middle">EventType 白名单（状态变化=事件）</text>

  <rect class="mod m-en" x="316" y="982" width="280" height="76" rx="9"/>
  <text class="modT" x="456" y="1006" text-anchor="middle">core/state | control</text>
  <text class="modS" x="456" y="1024" text-anchor="middle">Session/Task/Agent 模型</text>
  <text class="modS" x="456" y="1042" text-anchor="middle">事件溯源恢复 + Cancel/Pause 令牌</text>

  <rect class="mod m-en" x="608" y="982" width="268" height="76" rx="9"/>
  <text class="modT" x="742" y="1006" text-anchor="middle">protocols/</text>
  <text class="modS" x="742" y="1024" text-anchor="middle">Capability · LLM · Memory</text>
  <text class="modS" x="742" y="1042" text-anchor="middle">Knowledge · Template 契约</text>

  <rect class="mod m-en" x="888" y="982" width="256" height="76" rx="9"/>
  <text class="modT" x="1016" y="1006" text-anchor="middle">providers/（内置）</text>
  <text class="modS" x="1016" y="1024" text-anchor="middle">control·skill·agent·builtin</text>
  <text class="modS" x="1016" y="1042" text-anchor="middle">fs·mcp·llm·memory</text>

  <!-- ═══════════ 横向事件流 ═══════════ -->
  <rect class="b-ev" x="20" y="1110" width="1140" height="196" rx="14"/>
  <text class="bandT" x="36" y="1134" fill="#7e22ce">横向事件流（与纵向依赖正交：引擎内一切状态变化都是事件）</text>

  <!-- global-subscribe offshoot -->
  <rect class="mod m-ev" x="300" y="1146" width="560" height="34" rx="9"/>
  <text class="modS" x="580" y="1168" text-anchor="middle" font-weight="600">宿主【全局订阅】EventPersister 落盘 · ProjectionUpdater 投影 · SnapshotWriter 快照 · Telemetry</text>

  <!-- main linear flow -->
  <g>
    <rect class="mod m-ev" x="36"  y="1222" width="196" height="60" rx="9"/>
    <text class="modS" x="134" y="1248" text-anchor="middle" font-weight="600">引擎 步骤/网关</text>
    <text class="modS" x="134" y="1266" text-anchor="middle">编排器 emit</text>

    <rect class="mod m-ev" x="264" y="1222" width="196" height="60" rx="9"/>
    <text class="modS" x="362" y="1248" text-anchor="middle" font-weight="600">InProcessEventBus</text>
    <text class="modS" x="362" y="1266" text-anchor="middle">白名单·背压丢最旧</text>

    <rect class="mod m-ev" x="492" y="1222" width="196" height="60" rx="9"/>
    <text class="modS" x="590" y="1246" text-anchor="middle" font-weight="600">宿主【每会话订阅】</text>
    <text class="modS" x="590" y="1263" text-anchor="middle">session_consumer</text>
    <text class="modS" x="590" y="1277" text-anchor="middle">→ translate_event</text>

    <rect class="mod m-ev" x="720" y="1222" width="196" height="60" rx="9"/>
    <text class="modS" x="818" y="1248" text-anchor="middle" font-weight="600">sse_generator</text>
    <text class="modS" x="818" y="1266" text-anchor="middle">GET /stream · id:&lt;seq&gt;</text>

    <rect class="mod m-ev" x="948" y="1222" width="196" height="60" rx="9"/>
    <text class="modS" x="1046" y="1248" text-anchor="middle" font-weight="600">前端 EventSource</text>
    <text class="modS" x="1046" y="1266" text-anchor="middle">handle 归约 → 渲染</text>
  </g>
  <line x1="232" y1="1252" x2="262" y2="1252" stroke="#a855f7" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="460" y1="1252" x2="490" y2="1252" stroke="#a855f7" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="688" y1="1252" x2="718" y2="1252" stroke="#a855f7" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="916" y1="1252" x2="946" y2="1252" stroke="#a855f7" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- bus -> global offshoot -->
  <line x1="362" y1="1222" x2="362" y2="1182" stroke="#a855f7" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
